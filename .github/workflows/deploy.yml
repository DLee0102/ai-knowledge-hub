name: Auto-Index & Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-build-deploy"
  cancel-in-progress: false

jobs:
  build-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auto-generate knowledge index
        run: python3 scripts/build_index.py

      - name: Commit updated data/index.json back to branch (if changed)
        run: |
          if [ -n "$(git status --porcelain data/index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/index.json
            git commit -m "chore(index): auto-update knowledge index [skip ci]"
            git push
          else
            echo "No index changes to commit."
          fi

      - name: Stamp asset cache-busting version for Pages build
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          ver = os.environ.get("GITHUB_SHA", "dev")[:8]
          targets = [pathlib.Path("index.html"), *sorted(pathlib.Path("assets/js").glob("*.js"))]
          for p in targets:
              text = p.read_text(encoding="utf-8")
              updated = re.sub(r"\?v=[A-Za-z0-9._-]+", f"?v={ver}", text)
              if updated != text:
                  p.write_text(updated, encoding="utf-8")
          print(f"Stamped asset version ?v={ver}")
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-index
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
